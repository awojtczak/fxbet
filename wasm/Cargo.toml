[package]
name = "fxbet-wasm"
version = "0.1.0"
edition = "2024"

# The /api endpoints running in the browser (GitHub Pages build): same core as the server,
# records kept as JSON that the web app persists in localStorage.

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
fxbet-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
wasm-bindgen = "0.2"

[profile.release]
lto = true
opt-level = "s"
